# Replace skins.example.com with a domain pointed to this VPS.
# Bootstrap HTTP only; enable HTTPS before logging in:
#   sudo certbot --nginx -d skins.example.com --redirect
# Set PLAYER_ORIGIN=https://skins.example.com after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name skins.example.com;
    server_tokens off;
    client_max_body_size 32k;

    location = / { return 302 /play/; }
    location = /play { return 308 /play/; }

    location ^~ /play/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    # Keep admin, health, source files and credentials off this public host.
    location / { return 404; }
}
