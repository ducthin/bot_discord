# Replace teoteo.site with a domain pointed to this VPS.
# Bootstrap HTTP only; enable HTTPS before logging in:
#   sudo certbot --nginx -d teoteo.site -d www.teoteo.site --redirect
# Set PLAYER_ORIGIN=https://teoteo.site after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name teoteo.site;
    server_tokens off;
    client_max_body_size 32k;

    location = / { return 302 /play/; }
    location = /play { return 308 /play/; }

    location ^~ /play/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    # Keep admin, health, source files and credentials off this public host.
    location / { return 404; }
}

# Redirect www to the canonical origin used by player authentication.
server {
    listen 80;
    listen [::]:80;
    server_name www.teoteo.site;
    server_tokens off;
    return 301 https://teoteo.site$request_uri;
}

# Reject requests for IP addresses and unconfigured wildcard subdomains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}
