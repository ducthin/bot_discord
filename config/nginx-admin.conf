# Replace bot.example.com with the domain pointed to this VPS before enabling.
# This HTTP bootstrap config is upgraded to HTTPS by:
#   sudo certbot --nginx -d bot.example.com --redirect
# The application rejects public HTTP administration. Use the HTTPS URL after
# Certbot succeeds; ADMIN_ORIGIN must be exactly https://bot.example.com.
server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    server_tokens off;
    client_max_body_size 32k;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    # The bot's original health check remains available locally to the updater.
    # No project files, credentials, data, logs, or other application routes are
    # served from the public domain by this configuration.
    location / {
        return 404;
    }
}
